services:
  - type: web
    name: redaway-academy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-postgres.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    initialDeployHook: python manage.py setup_roles && python manage.py seed_curriculum && python manage.py seed_historical_essays && python manage.py createsuperuser --noinput
    healthCheckPath: /
    envVars:
      - key: REDAWAY_DEBUG
        value: "0"
      - key: REDAWAY_REGISTRATION_ENABLED
        value: "1"
      - key: REDAWAY_STORAGE_BACKEND
        value: supabase_s3
      - key: REDAWAY_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: REDAWAY_DEFAULT_FROM_EMAIL
        sync: false
      - key: REDAWAY_EMAIL_HOST
        sync: false
      - key: REDAWAY_EMAIL_PORT
        sync: false
      - key: REDAWAY_EMAIL_USER
        sync: false
      - key: REDAWAY_EMAIL_PASSWORD
        sync: false
      - key: REDAWAY_EMAIL_USE_TLS
        value: "1"
      - key: REDAWAY_EMAIL_USE_SSL
        value: "0"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
