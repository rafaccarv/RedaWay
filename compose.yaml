services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${REDAWAY_DB_NAME:?Set REDAWAY_DB_NAME in .env}
      POSTGRES_USER: ${REDAWAY_DB_USER:?Set REDAWAY_DB_USER in .env}
      POSTGRES_PASSWORD: ${REDAWAY_DB_PASSWORD:?Set REDAWAY_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      REDAWAY_DB_ENGINE: django.db.backends.postgresql
      REDAWAY_DB_HOST: db
      REDAWAY_DB_PORT: 5432
      REDAWAY_DB_SSLMODE: ""
      REDAWAY_REGISTRATION_ENABLED: ${REDAWAY_REGISTRATION_ENABLED:-0}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - profile_media:/app/media

volumes:
  profile_media:
  postgres_data:
